services:
  - type: web
    name: afyora-clinical-ai
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && gunicorn afyoraAIAgent.wsgi:application --bind "0.0.0.0:$PORT" --workers "${WEB_CONCURRENCY:-1}" --timeout "${GUNICORN_TIMEOUT_SECONDS:-90}" --access-logfile -
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: afyora-clinical-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODELS
        sync: false
      - key: GROQ_TIMEOUT_SECONDS
        value: "30"
      - key: CLINICAL_MCP_TIMEOUT_SECONDS
        value: "5"
      - key: CLINICAL_MAX_REQUEST_BYTES
        value: "65536"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_TIMEOUT_SECONDS
        value: "90"

databases:
  - name: afyora-clinical-db
    databaseName: afyaora_clinical_ai
    user: afyaora_clinical_ai
    region: oregon
    plan: 0.1c-256mb
